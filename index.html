<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mikko Tirronen Portfolio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Portfolio website of Mikko Tirronen, a web developer." />
    <script type="module" src="./js/app.js"></script>
    <link rel="preload" href="./assets/profile-square.png" as="image" fetchpriority="high" />
    <link rel="preload" href="./assets/no-margin-dark.png" as="image" />
    <link rel="preload" href="./assets/no-margin.png" as="image" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/media-queries.css" />
    <link rel="stylesheet" href="./css/weather.css" />
    <link rel="icon" type="image/png" href="./assets/no-margin.png" />
  </head>
  <body id="body" class="page" data-theme="light">
    <canvas id="bg-animation" aria-hidden="true"></canvas>
    <a href="#about" class="skip-link">Skip to main content</a>
    <header id="header">
      <nav id="nav" class="nav" aria-label="Main navigation"></nav>
    </header>
    <main id="page">
      <section id="hero" class="hero" aria-labelledby="hero-heading"></section>
      <section
        id="about"
        class="card"
        aria-labelledby="about-heading"
      ></section>
      <section
        id="skills"
        class="card skills-section"
        aria-labelledby="skills-heading"
      ></section>
      <section
        id="projects"
        class="card skills-section"
        aria-labelledby="projects-heading"
      ></section>
      <section
        id="testimonials"
        class="card"
        aria-labelledby="testimonials-heading"
      ></section>
      <section
        id="contact"
        class="card"
        aria-labelledby="contact-heading"
      ></section>
    </main>
    <footer
      id="footer"
      class="card"
      role="contentinfo"
      aria-label="Footer Section"
    ></footer>
  </body>
  <script src="./js/animations/background.js" type="module" defer></script>
  <script src="./js/animations/nav-scroll-animation.js"></script>
  <script src="./js/animations/theme-toggle.js" defer></script>
</html>
